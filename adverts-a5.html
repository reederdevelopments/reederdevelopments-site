<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printable Adverts (A5, A6, A7, A8 • 4 Variations Each) — ShelfMed & Slip Tracker ZA | ReederDevelopments</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="images/Icon.png" type="image/png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Standalone Vector QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

    <style id="dynamic-page-style">
        @page {
            size: A5 portrait;
            margin: 0;
        }
    </style>

    <style>
        :root {
            --slot-w: 148mm;
            --slot-h: 210mm;
            --flyer-scale: 1;
        }

        body.size-a5 {
            --slot-w: 148mm;
            --slot-h: 210mm;
            --flyer-scale: 1;
        }
        body.size-a6 {
            --slot-w: 105mm;
            --slot-h: 148mm;
            --flyer-scale: 0.709459;
        }
        body.size-a7 {
            --slot-w: 74mm;
            --slot-h: 105mm;
            --flyer-scale: 0.5;
        }
        body.size-a8 {
            --slot-w: 52mm;
            --slot-h: 74mm;
            --flyer-scale: 0.351351;
        }

        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
            color-adjust: exact !important;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #060913;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        .font-mono-tech {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Screen Preview Stage */
        .preview-stage {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 28px;
            padding: 28px 20px 64px;
        }

        /* Outer Physical Slot (Matches A5, A6, A7, or A8 exact mm dimensions) */
        .flyer-slot {
            width: var(--slot-w);
            height: var(--slot-h);
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.14);
            page-break-after: always;
            break-after: page;
            flex-shrink: 0;
        }

        /* Inner 148x210mm Master Canvas scaled proportionally */
        .flyer-canvas {
            width: 148mm;
            height: 210mm;
            transform-origin: top left;
            transform: scale(var(--flyer-scale));
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 9mm 8.5mm 7.5mm;
        }

        /* ShelfMed Pharmacy Themes (4 Subtle Accent Moods) */
        .theme-shelfmed-1 {
            background: radial-gradient(circle at 85% 15%, rgba(23, 195, 178, 0.32) 0%, transparent 48%),
                        radial-gradient(circle at 15% 88%, rgba(255, 113, 91, 0.25) 0%, transparent 48%),
                        linear-gradient(165deg, #06121C 0%, #0A2133 55%, #06121E 100%);
        }
        .theme-shelfmed-2 {
            background: radial-gradient(circle at 85% 15%, rgba(255, 113, 91, 0.32) 0%, transparent 48%),
                        radial-gradient(circle at 15% 88%, rgba(23, 195, 178, 0.26) 0%, transparent 48%),
                        linear-gradient(165deg, #130A1E 0%, #0C2033 55%, #06121E 100%);
        }
        .theme-shelfmed-3 {
            background: radial-gradient(circle at 85% 15%, rgba(245, 158, 11, 0.28) 0%, transparent 48%),
                        radial-gradient(circle at 15% 88%, rgba(23, 195, 178, 0.28) 0%, transparent 48%),
                        linear-gradient(165deg, #07141E 0%, #0D2538 55%, #06131D 100%);
        }
        .theme-shelfmed-4 {
            background: radial-gradient(circle at 85% 15%, rgba(56, 189, 248, 0.32) 0%, transparent 48%),
                        radial-gradient(circle at 15% 88%, rgba(16, 185, 129, 0.24) 0%, transparent 48%),
                        linear-gradient(165deg, #05101F 0%, #0A1E36 55%, #061220 100%);
        }

        /* Slip Tracker ZA Shopping Centre Themes (4 Subtle Accent Moods) */
        .theme-sliptracker-1 {
            background: radial-gradient(circle at 85% 15%, rgba(52, 211, 153, 0.32) 0%, transparent 48%),
                        radial-gradient(circle at 15% 88%, rgba(245, 158, 11, 0.22) 0%, transparent 48%),
                        linear-gradient(165deg, #061510 0%, #0A261C 55%, #06140F 100%);
        }
        .theme-sliptracker-2 {
            background: radial-gradient(circle at 85% 15%, rgba(245, 158, 11, 0.32) 0%, transparent 48%),
                        radial-gradient(circle at 15% 88%, rgba(16, 185, 129, 0.26) 0%, transparent 48%),
                        linear-gradient(165deg, #121307 0%, #0B251B 55%, #061510 100%);
        }
        .theme-sliptracker-3 {
            background: radial-gradient(circle at 85% 15%, rgba(6, 182, 212, 0.30) 0%, transparent 48%),
                        radial-gradient(circle at 15% 88%, rgba(52, 211, 153, 0.28) 0%, transparent 48%),
                        linear-gradient(165deg, #051618 0%, #092622 55%, #061410 100%);
        }
        .theme-sliptracker-4 {
            background: radial-gradient(circle at 85% 15%, rgba(16, 185, 129, 0.34) 0%, transparent 48%),
                        radial-gradient(circle at 15% 88%, rgba(99, 102, 241, 0.22) 0%, transparent 48%),
                        linear-gradient(165deg, #061318 0%, #0A241E 55%, #05120E 100%);
        }

        /* Light / Ink-Saver Mode */
        body.ink-saver [class*="theme-shelfmed"] {
            background: linear-gradient(165deg, #F0FDFA 0%, #FFFFFF 55%, #ECFEFF 100%) !important;
            color: #0F172A !important;
        }
        body.ink-saver [class*="theme-sliptracker"] {
            background: linear-gradient(165deg, #ECFDF5 0%, #FFFFFF 55%, #F0FDF4 100%) !important;
            color: #0F172A !important;
        }
        body.ink-saver .ink-text-main { color: #0F172A !important; }
        body.ink-saver .ink-text-sub { color: #334155 !important; }
        body.ink-saver .ink-card {
            background: #F8FAFC !important;
            border-color: #CBD5E1 !important;
            color: #0F172A !important;
        }
        body.ink-saver .ink-accent-teal { color: #0D9488 !important; }
        body.ink-saver .ink-accent-emerald { color: #059669 !important; }

        /* Smart Readability Optimizations for Smaller Sizes (A7 & A8) */
        body.size-a7 .bullet-sub {
            display: none !important;
        }
        body.size-a7 .bullet-title {
            font-size: 14pt !important;
        }
        body.size-a7 .qr-box {
            width: 48mm !important;
            height: 48mm !important;
        }

        /* A8 Mini Counter Card (52x74mm) — Ultra-Bold QR & Headline Focus */
        body.size-a8 .bullet-sub {
            display: none !important;
        }
        body.size-a8 .bullet-item {
            padding: 2.2mm 3mm !important;
        }
        body.size-a8 .bullet-title {
            font-size: 14.5pt !important;
        }
        body.size-a8 .hero-headline {
            font-size: 24.5pt !important;
            margin-top: 3mm !important;
        }
        body.size-a8 .qr-box {
            width: 52mm !important;
            height: 52mm !important;
        }

        /* A4 Multi-Up Cut Sheet Container */
        .a4-cut-sheet {
            display: grid;
            background: #060913;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.15);
            overflow: hidden;
            margin: 0 auto 32px;
            page-break-after: always;
            break-after: page;
        }
        body.ink-saver .a4-cut-sheet {
            background: #FFFFFF;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35), 0 0 0 1px #CBD5E1;
        }

        .a4-landscape {
            width: 297mm;
            height: 210mm;
        }
        .a4-portrait {
            width: 210mm;
            height: 297mm;
        }

        .a4-cut-sheet .flyer-slot {
            border-radius: 0 !important;
            box-shadow: none !important;
            page-break-after: avoid !important;
            break-after: avoid !important;
            outline: 0.35mm dashed rgba(255, 255, 255, 0.32);
        }
        body.ink-saver .a4-cut-sheet .flyer-slot {
            outline: 0.35mm dashed #94A3B8;
        }

        .qr-box svg {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        @media print {
            html, body {
                background: transparent !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .no-print { display: none !important; }
            .preview-stage {
                padding: 0 !important;
                margin: 0 !important;
                gap: 0 !important;
                display: block !important;
            }
            .flyer-slot {
                border-radius: 0 !important;
                box-shadow: none !important;
                margin: 0 !important;
            }
            .a4-cut-sheet {
                box-shadow: none !important;
                margin: 0 !important;
            }
        }
    </style>
</head>

            '3': {

                badgeIcon: 'fa-utensils',
                badgeText: 'EATING OUT OR SHOPPING?',
                subtitle: 'Restaurant Bill Splitter & ZAR Budget',

                bullets: [
                    { icon: 'fa-users-viewfinder', color: 'bg-amber-400/20 text-amber-400', title: 'Snap & Split Any Bill', sub: 'Assign items per friend, add tip & share on WhatsApp' },

                    { icon: 'fa-gauge-high', color: 'bg-cyan-400/20 text-cyan-400', title: 'Live Monthly ZAR Budget', sub: 'Track groceries, fuel litres & spending habits offline' }
                ],

                ctaTitle: 'Scan to Download',
                ctaFoot: '100% FREE • WORKS IN MALL PARKING'
            },
            '4': {
                theme: 'theme-sliptracker-4',
                badgeBg: 'bg-emerald-400 text-slate-950',
                badgeIcon: 'fa-user-shield',
                badgeText: 'NEVER SHARE BANK LOGINS!',
                subtitle: '100% Private & Offline Expense Tracker',
                headline: 'Track Every Rand You Spend — 100% Offline & Private.',
                bullets: [
                    { icon: 'fa-ban', color: 'bg-rose-500/20 text-rose-400', title: 'No Bank Passwords Ever', sub: 'Keep your bank accounts safe — scan paper slips instead' },
                    { icon: 'fa-microchip', color: 'bg-[#34D399]/20 text-[#34D399] ink-accent-emerald', title: '100% On-Device AI OCR', sub: 'Works completely offline without mobile data or Wi-Fi' },
                    { icon: 'fa-vault', color: 'bg-cyan-400/20 text-cyan-400', title: 'Encrypted Local Vault', sub: 'Your receipts & budgets stay locked on your own phone' }
                ],
                ctaPill: 'PRIVATE SA TRACKER 🇿🇦',
                ctaTitle: 'Scan to Install',
                ctaFoot: 'NO SIGN-UP • NO ADS • POPIA SAFE'

        const SIZE_SPECS = {
            a5: {
                label: 'A5 (148 × 210 mm)',
                pageRule: '148mm 210mm',
                a4Orientation: 'landscape',
                a4Class: 'a4-landscape',
                cols: 2,
                rows: 1,
                upCount: 2
            },
            a6: {
                label: 'A6 (105 × 148 mm)',
                pageRule: '105mm 148mm',
                a4Orientation: 'portrait',
                a4Class: 'a4-portrait',
                cols: 2,
                rows: 2,
                upCount: 4
            },
            a7: {
                label: 'A7 (74 × 105 mm)',
                pageRule: '74mm 105mm',
                a4Orientation: 'landscape',
                a4Class: 'a4-landscape',
                cols: 4,
                rows: 2,
                upCount: 8
            },
            a8: {
                label: 'A8 (52 × 74 mm)',
                pageRule: '52mm 74mm',
                a4Orientation: 'portrait',
                a4Class: 'a4-portrait',
                cols: 4,
                rows: 4,
                upCount: 16
            }
        };

        let currentSize = 'a5';
        let currentFilter = 'both';
        let currentVariation = '1'; // '1', '2', '3', '4', or 'all'
        let currentSheetMode = 'single'; // 'single' or 'a4-multi'

        function ensureMasterQRs() {
            const shelfBox = document.getElementById('qr-master-shelfmed');
            const slipBox = document.getElementById('qr-master-sliptracker');
            if (typeof qrcode === 'undefined') return;

            const buildQR = (url, iconSrc) => {
                const qr = qrcode(0, 'H');
                qr.addData(url);
                qr.make();
                return qr.createSvgTag({ cellSize: 4, margin: 1, scalable: true }) + `
                    <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;">
                        <img src="${iconSrc}" alt="" style="width:24%; height:24%; border-radius:6px; border:2px solid #ffffff; box-shadow:0 1px 4px rgba(0,0,0,0.35); background:#060913;">
                    </div>
                `;
            };

            if (!shelfBox.innerHTML.trim()) shelfBox.innerHTML = buildQR(PLAY_URLS.shelfmed, 'images/shelfmed-icon.png');
            if (!slipBox.innerHTML.trim()) slipBox.innerHTML = buildQR(PLAY_URLS.sliptracker, 'images/sliptrackerza-icon.png');
        }

        function buildFlyerSlot(appKey, varKey) {
            const isShelf = (appKey === 'shelfmed');
            const v = isShelf ? SHELFMED_VARIATIONS[varKey] : SLIPTRACKER_VARIATIONS[varKey];
            const qrHtml = document.getElementById(isShelf ? 'qr-master-shelfmed' : 'qr-master-sliptracker').innerHTML;

            const accentHex = isShelf ? '#17C3B2' : '#34D399';
            const accentClass = isShelf ? 'ink-accent-teal' : 'ink-accent-emerald';
            const iconPath = isShelf ? 'images/shelfmed-icon.png' : 'images/sliptrackerza-icon.png';
            const appTitleHtml = isShelf
                ? `Shelf<span class="text-[#17C3B2] ink-accent-teal">Med</span>`
                : `Slip Tracker <span class="text-[#34D399] ink-accent-emerald">ZA</span>`;
            const appTitleSize = isShelf ? 'text-[26pt]' : 'text-[24pt]';
            const subColor = isShelf ? 'text-teal-200' : 'text-emerald-200';
            const ctaBoxGrad = isShelf
                ? 'from-[#0E2B3D] to-[#081A26] border-[#17C3B2]'
                : 'from-[#0B2E22] to-[#071A13] border-[#34D399]';

            const bulletsHtml = v.bullets.map(b => `
                <div class="bullet-item flex items-center gap-3.5 p-3 rounded-2xl bg-white/[0.08] border border-white/15 ink-card">
                    <div class="w-11 h-11 rounded-xl ${b.color} flex items-center justify-center text-xl shrink-0">
                        <i class="fa-solid ${b.icon}"></i>
                    </div>
                    <div>
                        <div class="bullet-title font-black text-[12pt] leading-tight ink-text-main">${b.title}</div>
                        <div class="bullet-sub text-[9pt] text-gray-300 ink-text-sub">${b.sub}</div>
                    </div>
                </div>
            `).join('');

            const slot = document.createElement('section');
            slot.className = 'flyer-slot';
            slot.innerHTML = `
                <div class="flyer-canvas ${v.theme}">
                    <div>
                        <div class="flex items-center justify-between gap-2">
                            <div class="inline-flex items-center gap-2 ${v.badgeBg} font-black text-[10pt] uppercase tracking-widest px-4 py-1.5 rounded-full shadow-md">
                                <i class="fa-solid ${v.badgeIcon}"></i> ${v.badgeText}
                            </div>
                            <span class="font-mono-tech text-[7.5pt] font-bold px-2 py-0.5 rounded bg-white/10 text-gray-300 ink-text-sub">V${varKey}</span>
                        </div>

                        <div class="mt-4 flex items-center gap-4">
                            <img src="${iconPath}" alt="" class="w-[22mm] h-[22mm] rounded-2xl shadow-xl border-2" style="border-color:${accentHex}">
                            <div>
                                <h2 class="font-black ${appTitleSize} leading-none tracking-tight ink-text-main">
                                    ${appTitleHtml}
                                </h2>
                                <p class="font-bold text-[10.5pt] ${subColor} ink-text-sub mt-1">
                                    ${v.subtitle}
                                </p>
                            </div>
                        </div>

                        <h1 class="hero-headline mt-5 font-black text-[22.5pt] leading-[1.1] tracking-tight text-white ink-text-main">
                            ${v.headline}
                        </h1>
                    </div>

                    <div class="space-y-2.5 my-2">
                        ${bulletsHtml}
                    </div>

                    <div>
                        <div class="p-4 rounded-3xl bg-gradient-to-br ${ctaBoxGrad} border-2 shadow-2xl flex items-center justify-between gap-4 ink-card">
                            <div class="flex-1">
                                <span class="inline-block text-slate-950 font-black text-[8.5pt] uppercase tracking-wider px-3 py-1 rounded-full" style="background:${accentHex}">
                                    ${v.ctaPill}
                                </span>
                                <div class="font-black text-[18pt] leading-[1.1] text-white ink-text-main mt-2">
                                    ${v.ctaTitle}
                                </div>
                                <div class="flex items-center gap-1.5 text-[10pt] font-bold ${accentClass} mt-1.5" style="color:${accentHex}">
                                    <i class="fa-brands fa-google-play"></i> Google Play Store
                                </div>
                                <div class="text-[8pt] font-mono-tech font-bold text-gray-300 ink-text-sub mt-2">
                                    ${v.ctaFoot}
                                </div>
                            </div>

                            <div class="shrink-0 bg-white p-2.5 rounded-2xl shadow-lg border-2" style="border-color:${accentHex}">
                                <div class="qr-box w-[42mm] h-[42mm] relative flex items-center justify-center">${qrHtml}</div>
                            </div>
                        </div>

                        <div class="mt-3 flex items-center justify-between text-[7.5pt] text-gray-400 ink-text-sub">
                            <div class="flex items-center gap-1.5">
                                <img src="images/Icon.png" alt="" class="w-4 h-4 rounded">
                                <span class="font-bold text-white ink-text-main">ReederDevelopments</span>
                            </div>
                            <span class="font-mono-tech font-bold ${accentClass}" style="color:${accentHex}">reederdevelopments.co.za</span>
                        </div>
                    </div>
                </div>
            `;
            return slot;
        }

        function renderStage() {
            const stage = document.getElementById('print-stage');
            const pageStyle = document.getElementById('dynamic-page-style');
            const spec = SIZE_SPECS[currentSize];

            document.body.classList.remove('size-a5', 'size-a6', 'size-a7', 'size-a8');
            document.body.classList.add(`size-${currentSize}`);

            document.getElementById('a4-multi-label').textContent = `A4 Cut Sheet (${spec.upCount}-Up)`;
            stage.innerHTML = '';

            const activeApps = (currentFilter === 'both') ? ['shelfmed', 'sliptracker'] : [currentFilter];
            const activeVars = (currentVariation === 'all') ? ['1', '2', '3', '4'] : [currentVariation];

            // Build list of (app, variation) pairs
            const combos = [];
            activeApps.forEach(app => {
                activeVars.forEach(v => {
                    combos.push({ app, v });
                });
            });

            if (currentSheetMode === 'single') {
                pageStyle.innerHTML = `@page { size: ${spec.pageRule}; margin: 0; }`;
                combos.forEach(c => {
                    stage.appendChild(buildFlyerSlot(c.app, c.v));
                });
                document.getElementById('studio-status-bar').innerHTML =
                    `Showing <strong class="text-cyan-300">${combos.length} × ${spec.label}</strong> Page(s) • Variation: <strong class="text-amber-300">${currentVariation === 'all' ? 'All 4 Variations' : 'V' + currentVariation}</strong> • Enable <strong>"Background graphics"</strong> &amp; Margins: <strong>"None"</strong>.`;
            } else {
                // Multi-Up on A4 Cut Sheet(s)
                pageStyle.innerHTML = `@page { size: A4 ${spec.a4Orientation}; margin: 0; }`;
                // How many A4 sheets needed? Usually 1 sheet (unless combos.length > spec.upCount, e.g. 2-Up A5 with All 4 variations -> 2 or 4 sheets)
                const totalSlots = Math.max(spec.upCount, combos.length);
                const sheetCount = Math.ceil(totalSlots / spec.upCount);

                for (let s = 0; s < sheetCount; s++) {
                    const sheet = document.createElement('div');
                    sheet.className = `a4-cut-sheet ${spec.a4Class}`;
                    sheet.style.gridTemplateColumns = `repeat(${spec.cols}, var(--slot-w))`;
                    sheet.style.gridTemplateRows = `repeat(${spec.rows}, var(--slot-h))`;
                    sheet.style.justifyContent = 'center';
                    sheet.style.alignContent = 'center';

                    for (let i = 0; i < spec.upCount; i++) {
                        const globalIdx = s * spec.upCount + i;
                        const c = combos[globalIdx % combos.length];
                        sheet.appendChild(buildFlyerSlot(c.app, c.v));
                    }
                    stage.appendChild(sheet);
                }

                document.getElementById('studio-status-bar').innerHTML =
                    `Showing <strong class="text-emerald-300">${sheetCount} × A4 ${spec.a4Orientation.toUpperCase()} Cut Sheet(s)</strong> (${spec.upCount}-Up of ${spec.label}) • Variation: <strong class="text-amber-300">${currentVariation === 'all' ? 'All 4 Variations Mixed' : 'V' + currentVariation}</strong>.`;
            }
        }

        function setAdvertSize(size) {
            currentSize = size;
            ['a5', 'a6', 'a7', 'a8'].forEach(s => {
                const btn = document.getElementById(`btn-size-${s}`);
                btn.className = (s === size)
                    ? 'px-2.5 py-1 rounded-md font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 transition'
                    : 'px-2.5 py-1 rounded-md font-bold text-gray-400 hover:text-white transition';
            });
            renderStage();
        }

        function setVariation(v) {
            currentVariation = v;
            ['1', '2', '3', '4', 'all'].forEach(k => {
                const btn = document.getElementById(`btn-var-${k}`);
                btn.className = (k === v)
                    ? 'px-2.5 py-1 rounded-md font-semibold bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 transition'
                    : (k === 'all'
                        ? 'px-2.5 py-1 rounded-md font-semibold text-amber-300 hover:text-white transition'
                        : 'px-2.5 py-1 rounded-md font-semibold text-gray-400 hover:text-white transition');
            });
            renderStage();
        }

        function setFlyerFilter(which) {
            currentFilter = which;
            ['both', 'shelfmed', 'sliptracker'].forEach(f => {
                const btn = document.getElementById(`btn-filter-${f}`);
                btn.className = (f === which)
                    ? 'px-2.5 py-1.5 rounded-md font-semibold bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 transition'
                    : 'px-2.5 py-1.5 rounded-md font-semibold text-gray-400 hover:text-white transition';
            });
            renderStage();
        }

        function setSheetMode(mode) {
            currentSheetMode = mode;
            const btnSingle = document.getElementById('btn-sheet-single');
            const btnA4 = document.getElementById('btn-sheet-a4');
            if (mode === 'a4-multi') {
                btnA4.className = 'px-2.5 py-1.5 rounded-md font-semibold bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 transition';
                btnSingle.className = 'px-2.5 py-1.5 rounded-md font-semibold text-gray-400 hover:text-white transition';
            } else {
                btnSingle.className = 'px-2.5 py-1.5 rounded-md font-semibold bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 transition';
                btnA4.className = 'px-2.5 py-1.5 rounded-md font-semibold text-gray-400 hover:text-white transition';
            }
            renderStage();
        }

        function toggleInkMode() {
            document.body.classList.toggle('ink-saver');
            const isInkSaver = document.body.classList.contains('ink-saver');
            document.getElementById('ink-mode-label').textContent = isInkSaver ? 'Ink-Saver Light' : 'Vibrant Dark';
        }

        document.addEventListener('DOMContentLoaded', () => {
            ensureMasterQRs();
            renderStage();
        });
    </script>
